services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Ejecuta el script del esquema una sola vez y termina.
  # Usa la misma imagen del servidor porque ya incluye sqlcmd.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -I -b -S db -U sa -P "$$DB_PASSWORD" -i /scripts/01_schema.sql
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DB_HOST: db
      NODE_ENV: development
      TRUST_PROXY: "true"   # detras de nginx: el limite de peticiones usa la IP real del cliente
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Nginx sirve la interfaz y reenvia /api al backend: el navegador solo habla con
  # un origen (sin CORS). Abrir http://localhost:5173
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  sqldata:
